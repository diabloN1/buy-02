server:
  port: 8080

  ssl:
    enabled: true
    key-store: classpath:gateway-keystore.p12
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD:123123}
    key-alias: gateway

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            - id: media-service
              uri: lb://MEDIA-SERVICE
              predicates:
                - Path=/api/media/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka


jwt:
  secret: ${JWT_SECRET:WUTsutO3lC3LuEI2g78FI6Gvxm5ZkmltirMrq099JfhPvJlRVNobuloPiyLHgSrx}

management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    org.springframework.cloud.gateway: TRACE
